<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: mediastream:;">
  <title>Vexa</title>
  <style>
    :root {
      --fondo: #0b0c0f;
      --barra: #101218;
      --panel: #14161c;
      --borde: #23262f;
      --borde-vivo: #333846;
      --texto: #e7e9ef;
      --tenue: #8b90a1;
      --acento: #7c5cff;
      --ok: #46d19b;
      --error: #ff6b6b;
      /* Tiene que coincidir con ALTO_BARRA en main.js */
      --alto-barra: 56px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* --- Barra de navegacion --- */

    header {
      height: var(--alto-barra);
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      background: var(--barra);
      border-bottom: 1px solid var(--borde);
    }

    .icono {
      width: 34px;
      height: 34px;
      flex: none;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--texto);
      cursor: pointer;
      transition: background .12s, color .12s;
    }

    .icono:hover:not(:disabled) { background: #1c1f28; }
    .icono:active:not(:disabled) { background: #262a35; }
    .icono:disabled { color: #4a4e5b; cursor: default; }
    .icono svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .barra-url {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px;
      margin: 0 4px;
      background: #0a0b0f;
      border: 1px solid var(--borde);
      border-radius: 9px;
      transition: border-color .12s;
    }

    .barra-url:focus-within { border-color: var(--acento); }

    .barra-url .lupa { width: 15px; height: 15px; flex: none; color: var(--tenue); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

    #entrada {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--texto);
      font: inherit;
      outline: none;
      user-select: text;
    }

    #entrada::placeholder { color: #5f6474; }

    .insignia {
      flex: none;
      display: none;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: #16121f;
      color: var(--tenue);
      font-size: 12px;
      cursor: pointer;
    }

    .insignia.visible, .insignia.siempre { display: flex; }

    .punto-sesion {
      width: 7px; height: 7px; border-radius: 50%; flex: none;
      background: #4a4e5b;
    }

    .insignia.conectado { border-color: var(--ok); color: var(--texto); }
    .insignia.conectado .punto-sesion { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .insignia.trabajando .punto-sesion { background: #e8b24a; }
    .insignia.cedido { border-color: var(--acento); color: var(--texto); }
    .insignia.cedido .punto-sesion { background: var(--acento); box-shadow: 0 0 8px var(--acento); }

    /* Con el control tomado, el video recibe clics; si no, los deja pasar. */
    #video-remoto { cursor: default; outline: none; }
    #video-remoto.con-control { cursor: crosshair; }
    .insignia:hover { border-color: var(--acento); color: var(--texto); }
    .insignia b { color: var(--acento); font-variant-numeric: tabular-nums; }

    /* --- Zona de contenido (queda debajo del navegador cuando hay pagina) --- */

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: auto;
    }

    .pantalla { display: none; width: 100%; max-width: 560px; text-align: center; }
    .pantalla.visible { display: block; }

    h1 {
      margin: 0;
      font-size: 46px;
      letter-spacing: -1.5px;
      background: linear-gradient(100deg, var(--texto), var(--acento));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .lema { margin: 8px 0 30px; color: var(--tenue); }

    .ayuda {
      display: grid;
      gap: 10px;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 20px 22px;
      color: var(--tenue);
      font-size: 13px;
    }

    .ayuda b { color: var(--texto); font-weight: 600; }

    kbd {
      display: inline-block;
      padding: 1px 6px;
      border: 1px solid var(--borde-vivo);
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #1a1d25;
      color: var(--texto);
      font: 11px/1.6 ui-monospace, Consolas, monospace;
    }

    .cartel-error {
      background: var(--panel);
      border: 1px solid #3a2530;
      border-radius: 12px;
      padding: 26px 24px;
    }

    .cartel-error h2 { margin: 0 0 8px; font-size: 18px; color: var(--error); }
    .cartel-error p { margin: 0 0 6px; color: var(--tenue); }

    .cartel-error .direccion {
      margin: 14px 0 20px;
      padding: 9px 12px;
      background: #0a0b0f;
      border: 1px solid var(--borde);
      border-radius: 8px;
      font: 12px/1.5 ui-monospace, Consolas, monospace;
      color: var(--tenue);
      word-break: break-all;
      user-select: text;
    }

    .botones { display: flex; gap: 10px; justify-content: center; }

    button.texto {
      padding: 10px 18px;
      border: 1px solid var(--borde);
      border-radius: 9px;
      background: #1b1e26;
      color: var(--texto);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }

    button.texto:hover { background: #232733; border-color: var(--borde-vivo); }
    button.texto.principal { background: var(--acento); border-color: var(--acento); }
    button.texto.principal:hover { background: #8b6dff; }

    /* --- Panel de sesion --- */

    .panel-sesion {
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 24px;
    }

    .panel-sesion h2 { margin: 0 0 4px; font-size: 19px; }
    .panel-sesion .bajada { margin: 0 0 20px; color: var(--tenue); font-size: 13px; }

    .paso { margin-bottom: 18px; }
    .paso:last-of-type { margin-bottom: 0; }

    .paso h3 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--tenue);
    }

    textarea {
      width: 100%;
      height: 88px;
      resize: none;
      padding: 10px 12px;
      background: #0a0b0f;
      border: 1px solid var(--borde);
      border-radius: 9px;
      color: var(--texto);
      font: 11px/1.45 ui-monospace, Consolas, monospace;
      word-break: break-all;
      outline: none;
      user-select: text;
    }

    textarea:focus { border-color: var(--acento); }
    textarea[readonly] { color: var(--tenue); }

    .fila { display: flex; gap: 10px; margin-top: 10px; }
    .fila button { flex: 1; }

    .estado-sesion {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 20px 0 0;
      padding: 11px 13px;
      background: #0f1116;
      border: 1px solid var(--borde);
      border-radius: 9px;
      font-size: 13px;
      color: var(--tenue);
    }

    .estado-sesion .punto {
      width: 8px; height: 8px; border-radius: 50%; flex: none;
      background: var(--tenue);
    }

    .estado-sesion.trabajando .punto { background: #e8b24a; }
    .estado-sesion.ok .punto { background: var(--ok); box-shadow: 0 0 9px var(--ok); }
    .estado-sesion.ok { color: var(--texto); }
    .estado-sesion.error .punto { background: var(--error); }
    .estado-sesion.error { color: var(--error); }

    .codigo-grande {
      margin: 4px 0 14px;
      padding: 18px 12px;
      text-align: center;
      background: #0a0b0f;
      border: 1px solid var(--acento);
      border-radius: 11px;
      font: 700 34px/1.1 ui-monospace, "Cascadia Mono", Consolas, monospace;
      letter-spacing: 4px;
      color: var(--texto);
      user-select: text;
    }

    .etiqueta {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--tenue);
    }

    .nota { margin: 10px 0 0; color: var(--tenue); font-size: 12px; }
    .nota code { color: var(--texto); font-size: 11px; }

    input[type="text"] {
      width: 100%;
      padding: 11px 13px;
      background: #0a0b0f;
      border: 1px solid var(--borde);
      border-radius: 9px;
      color: var(--texto);
      font: inherit;
      outline: none;
      user-select: text;
    }

    input[type="text"]:focus { border-color: var(--acento); }

    .codigo-entrada {
      font: 700 24px/1.2 ui-monospace, Consolas, monospace;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      padding: 11px 13px;
      background: #0a0b0f;
      border: 1px solid var(--borde);
      border-radius: 9px;
      color: var(--texto);
      font: inherit;
      outline: none;
      cursor: pointer;
    }

    select:focus { border-color: var(--acento); }

    .avanzado { margin-top: 14px; }

    .avanzado summary {
      cursor: pointer;
      color: var(--tenue);
      font-size: 13px;
      list-style: none;
    }

    .avanzado summary::-webkit-details-marker { display: none; }
    .avanzado summary::before { content: '+ '; color: var(--acento); }
    .avanzado[open] summary::before { content: '- '; }
    .avanzado summary:hover { color: var(--texto); }
    .avanzado input { margin-top: 10px; }

    .separador { border: 0; border-top: 1px solid var(--borde); margin: 18px 0; }

    /* --- Video del amigo (modo espectador) --- */

    #video-remoto {
      position: fixed;
      left: 0;
      top: var(--alto-barra);
      width: 100vw;
      height: calc(100vh - var(--alto-barra));
      background: #000;
      object-fit: contain;
      display: none;
      z-index: 5;
    }

    #video-remoto.visible { display: block; }

    /* --- Aviso flotante --- */

    #aviso {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 20px);
      max-width: 80vw;
      padding: 11px 18px;
      background: #1b1e26;
      border: 1px solid var(--borde-vivo);
      border-radius: 10px;
      color: var(--texto);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s, transform .18s;
    }

    #aviso.visible { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <header>
    <button class="icono" id="boton-atras" type="button" data-t-title="barra.atras" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="icono" id="boton-adelante" type="button" data-t-title="barra.adelante" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="icono" id="boton-recargar" type="button" data-t-title="barra.recargar">
      <svg viewBox="0 0 24 24" id="icono-recargar"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg>
    </button>
    <button class="icono" id="boton-inicio" type="button" data-t-title="barra.inicio">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    </button>

    <div class="barra-url">
      <svg class="lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="entrada" type="text" spellcheck="false" autocomplete="off"
             data-t-ph="barra.direccion">
    </div>

    <button class="insignia" id="boton-control" type="button" data-t-title="barra.darControlAyuda">
      <span class="punto-sesion" id="punto-control"></span> <span id="texto-control" data-t="barra.darControl"></span>
    </button>

    <button class="insignia siempre" id="boton-sesion" type="button" data-t-title="barra.verJuntosAyuda">
      <span class="punto-sesion" id="punto-sesion"></span> <span data-t="barra.verJuntos"></span>
    </button>

    <button class="insignia" id="insignia-bloqueados" type="button"
            >
      <b id="cuenta-bloqueados">0</b> <span data-t="barra.bloqueados"></span>
    </button>
  </header>

  <main>
    <section class="pantalla visible" id="pantalla-inicio">
      <h1>Vexa</h1>
      <p class="lema" data-t="inicio.lema"></p>
      <div class="ayuda">
        <div data-t="inicio.ayuda1"></div>
        <div data-t="inicio.ayuda2"></div>
        <div><b data-t="inicio.ayuda3"></b> <kbd>Ctrl</kbd>+<kbd>L</kbd> <span data-t="inicio.atajoBarra"></span> · <kbd>Alt</kbd>+<kbd>←</kbd> <span data-t="inicio.atajoAtras"></span> · <kbd>F5</kbd> <span data-t="inicio.atajoRecargar"></span> · <kbd>Esc</kbd> <span data-t="inicio.atajoDetener"></span></div>
        <div id="linea-version" class="lema" style="margin:2px 0 0"></div>
      </div>
    </section>

    <section class="pantalla" id="pantalla-error">
      <div class="cartel-error">
        <h2 data-t="error.titulo"></h2>
        <p id="error-detalle" data-t="error.detalle"></p>
        <div class="direccion" id="error-url"></div>
        <div class="botones">
          <button class="texto principal" id="boton-reintentar" type="button" data-t="error.reintentar"></button>
          <button class="texto" id="boton-volver" type="button" data-t="error.volver"></button>
        </div>
      </div>
    </section>
    <section class="pantalla" id="pantalla-sesion">
      <div class="panel-sesion">
        <h2 data-t="sesion.titulo"></h2>
        <p class="bajada" data-t="sesion.bajada"></p>

        <div id="sesion-elegir">
          <div class="fila">
            <button class="texto principal" id="boton-abrir" type="button" data-t="sesion.abrir"></button>
            <button class="texto" id="boton-entrar" type="button" data-t="sesion.entrar"></button>
          </div>
          <details class="avanzado">
            <summary data-t="sesion.elegirCodigo"></summary>
            <input type="text" id="codigo-propio" spellcheck="false" autocomplete="off"
                   maxlength="24" data-t-ph="sesion.codigoPropioEjemplo">
            <p class="nota" data-t="sesion.codigoPropioNota"></p>
          </details>
        </div>

        <div id="sesion-anfitrion" hidden>
          <p class="etiqueta" data-t="sesion.pasaleCodigo"></p>
          <div class="codigo-grande" id="codigo-sala">·····</div>
          <div class="fila">
            <button class="texto principal" id="boton-copiar-codigo" type="button" data-t="sesion.copiar"></button>
          </div>
          <p class="nota" id="nota-espera" data-t="sesion.esperando"></p>
        </div>

        <div id="sesion-espectador" hidden>
          <p class="etiqueta" data-t="sesion.escribiCodigo"></p>
          <input type="text" id="codigo-para-entrar" spellcheck="false" autocomplete="off"
                 maxlength="24" placeholder="4K7-M9P" class="codigo-entrada">
          <div class="fila">
            <button class="texto principal" id="boton-conectar" type="button" data-t="sesion.conectar"></button>
          </div>
        </div>

        <div class="estado-sesion" id="estado-sesion">
          <span class="punto"></span>
          <span id="estado-sesion-texto" data-t="estado.sinConexion"></span>
        </div>

        <div class="fila" style="margin-top:14px">
          <button class="texto" id="boton-cortar" type="button" data-t="sesion.cortar"></button>
          <button class="texto" id="boton-ajustes" type="button" data-t="sesion.ajustes"></button>
        </div>

        <div id="bloque-ajustes" hidden>
          <hr class="separador">
          <p class="etiqueta" data-t="ajustes.servidor"></p>
          <input type="text" id="campo-servidor" spellcheck="false" autocomplete="off"
                 placeholder="https://mi-vexa.onrender.com">
          <p class="nota" data-t="ajustes.servidorNota"></p>
          <div class="fila">
            <button class="texto principal" id="boton-guardar-ajustes" type="button" data-t="ajustes.guardar"></button>
            <button class="texto" id="boton-probar-servidor" type="button" data-t="ajustes.probar"></button>
          </div>

          <hr class="separador">
          <p class="etiqueta" data-t="ajustes.idioma"></p>
          <select id="selector-idioma"></select>
          <p class="nota" data-t="ajustes.idiomaNota"></p>
        </div>
      </div>
    </section>
  </main>

  <video id="video-remoto" autoplay playsinline tabindex="0"></video>

  <div id="aviso" role="status"></div>

  <script src="conexion.js"></script>
  <script src="mando.js"></script>
  <script src="app.js"></script>
</body>
</html>
