<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Vexa</title>
  <style>
    /* Esta pagina existe por un motivo tecnico, no decorativo: un navegador
       que nunca cargo nada no se puede capturar (da "Timeout starting video
       source"), asi que Vexa carga esto apenas arranca. De paso, si abris una
       sala antes de buscar nada, tu amigo ve este cartel en vez de un vacio. */
    html, body {
      height: 100%;
      margin: 0;
      background: #0b0c0f;
      color: #5f6474;
      font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    /* El texto aparece recien despues de un segundo. Al arrancar, Vexa muestra
       esta pagina un instante (hace falta para que despues se pueda capturar),
       y como el fondo es el mismo de la app, ese instante no se ve. Si
       apareciera el texto, se veria un parpadeo. */
    div {
      text-align: center;
      opacity: 0;
      animation: aparecer .4s ease-out 1.2s forwards;
    }

    @keyframes aparecer { to { opacity: 1; } }
    b {
      display: block;
      font-size: 34px;
      letter-spacing: -1px;
      margin-bottom: 10px;
      background: linear-gradient(115deg, #8b5cf6, #d96eff 55%, #38d6ee);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
  </style>
</head>
<body>
  <div>
    <b>Vexa</b>
    Todavía no abrí ninguna página.
  </div>
</body>
</html>
