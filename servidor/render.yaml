# Publicar el servidor de encuentro de Vexa en Render, gratis.
#
# En render.com: New > Blueprint, se elige este repositorio y listo.
# Render lee este archivo y arma el servicio solo.
services:
  - type: web
    name: vexa-encuentro
    runtime: node
    plan: free
    # El servidor no tiene dependencias, pero Render espera un build.
    buildCommand: echo "sin dependencias que instalar"
    startCommand: node servidor/index.js
    healthCheckPath: /salud
